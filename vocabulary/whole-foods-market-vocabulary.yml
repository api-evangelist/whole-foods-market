    name: Purchase Order
    direction: Whole Foods to Supplier

  - code: "855"
    name: Purchase Order Acknowledgment
    direction: Supplier to Whole Foods

  - code: "856"
    name: Advanced Shipment Notice
    direction: Supplier to Whole Foods

  - code: "810"
    name: Invoice
    direction: Supplier to Whole Foods

  - code: "820"
    name: Payment Order / Remittance Advice
    direction: Whole Foods to Supplier

  - code: "997"
    name: Functional Acknowledgment
    direction: Both

